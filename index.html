<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oryven</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js" defer></script>
  </head>
  <body>
    <!-- header -->
    <header class="topbar">
      <h1>Oryven</h1>
      <div class="cntrls">
        <label for="currency" class="currencylabel">Devise</label>
        <select id="currency">
          <option value="MAD">MAD</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
        </select>
        <button id="refresh" type="button">Cours des métaux</button>
        <button id="catalogue" type="button">Catalogue</button>
      </div>
    </header>

    <!-- leading the data -->
    <div id="status" class="status loading">
      <span class="rotatedcircle"></span>
      <span id="status-text">Chargement en cours…</span>
      <button id="retry" type="button" hidden>Réessayer</button>
    </div>

    <main>
      <!-- metals -->
      <section class="oryven">
        <div id="cards" class="cards"></div>
        <div class="container"></div>
      </section>
    </main>
  </body>
</html>
